name: Relay Cloud Deployment (Disabled Placeholder)

# ==============================================================================
# NOTICE: Automated Cloud Deployment via GitHub Actions is INTENTIONALLY DISABLED.
#
# Single Authoritative Deployment Path:
# All Azure provisioning, bootstrapping, schema migration, and revision rollout
# operations must be performed using the reviewed local deployment orchestrator:
#   ./deploy/scripts/deploy.sh <env> <region>
#
# This workflow cannot provision or alter Azure cloud resources:
# - Zero id-token or write permissions
# - Zero Azure login or secret access
# - Zero cloud resource provisioning or container builds
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      notice:
        description: 'Notice of Disabled State'
        required: false
        default: 'Cloud deployment via GitHub Actions is disabled. Use deploy.sh instead.'

permissions:
  contents: read

jobs:
  disabled_notice:
    name: Cloud Deployment Disabled
    runs-on: ubuntu-latest

    steps:
      - name: Print Authoritative Deployment Path Notice
        run: |
          echo "================================================================================"
          echo "NOTICE: CLOUD DEPLOYMENT VIA GITHUB ACTIONS IS INTENTIONALLY DISABLED"
          echo "================================================================================"
          echo "Automated CI/CD deployment through GitHub Actions has been disabled to prevent"
          echo "accidental provisioning and dual deployment discrepancies."
          echo ""
          echo "The SINGLE AUTHORITATIVE deployment mechanism is the local orchestrator:"
          echo "  ./deploy/scripts/deploy.sh <environment> <region>"
          echo ""
          echo "Refer to docs/deployment/azure-deployment.md for the authoritative runbook."
          echo "================================================================================"
          exit 1
