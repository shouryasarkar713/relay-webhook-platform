name: Relay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (.NET 10 & SQL Server)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_Strong_Password123!"
          MSSQL_PID: "Developer"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_Strong_Password123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_Strong_Password123!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore Relay.sln

      - name: Build Solution
        run: dotnet build Relay.sln --configuration Release --no-restore -warnaserror

      - name: Run Unit Tests
        run: dotnet test tests/Relay.UnitTests/Relay.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx"

      - name: Start Azure Service Bus Emulator
        run: |
          docker run -d --name servicebus-emulator --network host             -e ACCEPT_EULA=Y             -e SQL_SERVER=127.0.0.1             -e MSSQL_SA_PASSWORD='Your_Strong_Password123!'             -v "${{ github.workspace }}/emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"             mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/5672) 2>/dev/null; then echo "Service Bus emulator is listening on 5672"; exit 0; fi
            sleep 3
          done
          echo "Service Bus emulator did not start in time"; docker logs servicebus-emulator || true; exit 1

      - name: Run Integration Tests
        env:
          RELAY_TEST_CONNECTION_STRING: "Server=localhost,1433;Database=RelayTestDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;MultipleActiveResultSets=True;"
        run: dotnet test tests/Relay.IntegrationTests/Relay.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration-tests.trx"

  frontend:
    name: Frontend CI (React 19 & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/relay-dashboard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/relay-dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run lint

      - name: Production Build
        run: npm run build

  iac-and-containers:
    name: IaC Validation & Container Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bicep (Azure CLI)
        run: az bicep install

      - name: Validate Bicep Compilation
        run: az bicep build --file deploy/main.bicep --stdout > /dev/null

      - name: Build API Docker Image
        run: docker build -f src/Relay.Api/Dockerfile -t relay-api:${{ github.sha }} .

      - name: Build Worker Docker Image
        run: docker build -f src/Relay.Worker/Dockerfile -t relay-worker:${{ github.sha }} .

      - name: Build Admin & Migration Docker Image
        run: docker build -f src/Relay.Admin/Dockerfile -t relay-admin:${{ github.sha }} .
