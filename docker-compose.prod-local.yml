version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: relay-sqlserver-prodlocal
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Strong_Password123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - relay_mssql_prod_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_Strong_Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: relay-sb-emulator-prodlocal
    ports:
      - "5672:5672"
    environment:
      - SQL_SERVER=sqlserver
      - MSSQL_SA_PASSWORD=Your_Strong_Password123!
      - ACCEPT_EULA=Y
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/Relay.Api/Dockerfile
    container_name: relay-api-prodlocal
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__RelayDatabase=Server=sqlserver,1433;Database=RelayDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://127.0.0.1:5173
    depends_on:
      sqlserver:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Relay.Worker/Dockerfile
    container_name: relay-worker-prodlocal
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__RelayDatabase=Server=sqlserver,1433;Database=RelayDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - ServiceBus__ConnectionString=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - ServiceBus__QueueOrTopicName=relay-events
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  relay_mssql_prod_data:
